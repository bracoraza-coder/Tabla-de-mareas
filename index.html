<!doctype html>

    <meta charset="UTF-8" />

    <!--
      window.fetch hardening:
      - configurable: false  → scripts maliciosos no pueden redefinir la propiedad.
      - writable: false       → asignación directa (window.fetch = x) lanza TypeError en modo estricto.
      El bloque try/catch silencia el error si el entorno no soporta defineProperty
      (p.ej. algunos webviews antiguos), degradando con elegancia.
    -->
    <script>
      (function () {
        try {
          var _realFetch = window.fetch;
          if (typeof _realFetch !== 'function') return;
          Object.defineProperty(window, 'fetch', {
            value: _realFetch,
            writable: false,
            configurable: false,
            enumerable: true,
          });
        } catch (e) {
          // Entorno no compatible — continuar sin el hardening.
        }
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

  <body>
    <div id="root"></div>

    <!--
      Offline / error fallback:
      Si el bundle principal no se carga (fallo de red, CDN caído, etc.)
      se muestra un estado visual mínimo con datos cacheados del último
      uso, recuperados de localStorage.
    -->
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#94a3b8;font-family:sans-serif;text-align:center;padding:2rem;">
        <div>
          <h1 style="color:#38bdf8;margin-bottom:1rem;">InfoMarea Pro</h1>
          <p>Para usar InfoMarea Pro necesitas activar JavaScript en tu navegador.</p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

    <!--
      Global error boundary para fallos de red en el bundle principal.
      Muestra datos cacheados de localStorage si existen, o un mensaje de error.
    -->
    <script>
      window.addEventListener('error', function (e) {
        // Solo actuar si el root sigue vacío (el bundle no se montó)
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;

        var lastPort = '';
        var lastData = null;
        try {
          lastPort = localStorage.getItem('infomarea_last_port') || '';
          var raw    = localStorage.getItem('infomarea_last_tides');
          if (raw) lastData = JSON.parse(raw);
        } catch (_) {}

        var msg = lastData
          ? '<p style="color:#34d399;margin:0.5rem 0">Mostrando los últimos datos guardados para <strong>' + lastPort + '</strong>.</p><p style="font-size:0.8rem;color:#64748b">Comprueba tu conexión y recarga para obtener datos actualizados.</p>'
          : '<p style="color:#f87171;margin:0.5rem 0">No se pudo cargar la aplicación.</p><p style="font-size:0.8rem;color:#64748b">Comprueba tu conexión a internet y recarga la página.</p>';

        root.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#94a3b8;font-family:sans-serif;text-align:center;padding:2rem;">' +
          '<div><h1 style="color:#38bdf8;margin-bottom:1rem;">InfoMarea Pro</h1>' + msg +
          '<button onclick="location.reload()" style="margin-top:1.5rem;padding:0.6rem 1.5rem;background:#0284c7;color:#fff;border:none;border-radius:0.5rem;cursor:pointer;font-size:1rem;">Reintentar</button>' +
          '</div></div>';
      });
    </script>
  </body>
